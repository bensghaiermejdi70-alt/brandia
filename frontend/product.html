<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produit - Brandia</title>
<meta name="description" content="Découvrez ce produit sur Brandia">

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
darkMode: 'class',
theme: {
extend: {
colors: {
brandia: {
primary: '#6366f1',
secondary: '#8b5cf6',
accent: '#ec4899',
dark: '#0f172a',
darker: '#020617',
card: '#1e293b',
border: '#334155',
text: '#f8fafc',
muted: '#94a3b8',
success: '#10b981',
warning: '#f59e0b',
danger: '#ef4444',
},
},
fontFamily: {
sans: ['Inter', 'system-ui', 'sans-serif'],
}
}
}
}
</script>

<!-- Fonts & Icons -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
--brandia-primary: #6366f1;
--brandia-primary-hover: #4f46e5;
--brandia-secondary: #8b5cf6;
--brandia-accent: #ec4899;
--brandia-dark: #0f172a;
--brandia-darker: #020617;
--brandia-card: #1e293b;
--brandia-border: #334155;
--brandia-text: #f8fafc;
--brandia-text-muted: #94a3b8;
--brandia-success: #10b981;
--brandia-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
font-family: 'Inter', system-ui, sans-serif;
background-color: var(--brandia-darker);
color: var(--brandia-text);
line-height: 1.6;
overflow-x: hidden;
}

.container {
max-width: 1400px;
margin: 0 auto;
padding: 0 2rem;
}

/* Header */
.header {
position: sticky;
top: 0;
z-index: 50;
background: rgba(15, 23, 42, 0.95);
backdrop-filter: blur(12px);
border-bottom: 1px solid var(--brandia-border);
padding: 1rem 0;
}

.header-inner {
display: flex;
align-items: center;
justify-content: space-between;
}

.brandia-logo {
display: flex;
align-items: center;
gap: 0.75rem;
text-decoration: none;
}

.brandia-icon-bg {
width: 40px;
height: 40px;
border-radius: 10px;
background: var(--brandia-gradient);
display: flex;
align-items: center;
justify-content: center;
}

.brandia-icon-svg {
width: 24px;
height: 24px;
color: white;
}

.brandia-text {
font-family: 'Outfit', sans-serif;
font-size: 1.5rem;
font-weight: 800;
background: var(--brandia-gradient);
-webkit-background-clip: text;
background-clip: text;
-webkit-text-fill-color: transparent;
}

/* Breadcrumb */
.breadcrumb {
display: flex;
align-items: center;
gap: 0.5rem;
padding: 1.5rem 0;
color: var(--brandia-text-muted);
font-size: 0.875rem;
}

.breadcrumb a {
color: var(--brandia-text-muted);
text-decoration: none;
transition: color 0.2s;
}

.breadcrumb a:hover { color: var(--brandia-text); }

/* Product Section */
.product-section {
display: grid;
grid-template-columns: 1fr;
gap: 3rem;
padding: 2rem 0;
}

@media (min-width: 1024px) {
.product-section {
grid-template-columns: 1fr 1fr;
}
}

/* Gallery */
.product-gallery {
position: sticky;
top: 100px;
}

.main-image {
width: 100%;
aspect-ratio: 1;
background: var(--brandia-card);
border: 1px solid var(--brandia-border);
border-radius: 20px;
overflow: hidden;
margin-bottom: 1rem;
display: flex;
align-items: center;
justify-content: center;
}

.main-image img {
width: 100%;
height: 100%;
object-fit: cover;
}

.thumbnail-list {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 1rem;
}

.thumbnail {
aspect-ratio: 1;
background: var(--brandia-card);
border: 2px solid var(--brandia-border);
border-radius: 12px;
overflow: hidden;
cursor: pointer;
transition: all 0.3s;
}

.thumbnail:hover, .thumbnail.active {
border-color: var(--brandia-primary);
}

.thumbnail img {
width: 100%;
height: 100%;
object-fit: cover;
}

/* Product Info */
.product-info {
display: flex;
flex-direction: column;
gap: 1.5rem;
}

.product-category {
display: inline-block;
background: rgba(99, 102, 241, 0.2);
color: var(--brandia-primary);
padding: 0.4rem 1rem;
border-radius: 50px;
font-size: 0.85rem;
font-weight: 600;
}

.product-title {
font-size: 2rem;
font-weight: 800;
line-height: 1.2;
}

@media (min-width: 768px) {
.product-title { font-size: 2.5rem; }
}

.product-price {
display: flex;
align-items: baseline;
gap: 1rem;
flex-wrap: wrap;
}

.current-price {
font-size: 2rem;
font-weight: 800;
background: var(--brandia-gradient);
-webkit-background-clip: text;
background-clip: text;
-webkit-text-fill-color: transparent;
}

@media (min-width: 768px) {
.current-price { font-size: 2.5rem; }
}

.original-price {
font-size: 1.25rem;
color: var(--brandia-text-muted);
text-decoration: line-through;
}

.discount-badge {
background: var(--brandia-success);
color: white;
padding: 0.3rem 0.8rem;
border-radius: 50px;
font-weight: 700;
font-size: 0.875rem;
}

.product-description {
color: var(--brandia-text-muted);
line-height: 1.8;
}

/* Product Meta */
.product-meta {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 1rem;
padding: 1.5rem;
background: var(--brandia-card);
border: 1px solid var(--brandia-border);
border-radius: 16px;
}

.meta-item {
text-align: center;
}

.meta-item i {
font-size: 1.5rem;
color: var(--brandia-primary);
margin-bottom: 0.5rem;
}

.meta-label {
display: block;
font-size: 0.85rem;
color: var(--brandia-text-muted);
margin-bottom: 0.3rem;
}

.meta-value {
font-weight: 700;
color: var(--brandia-text);
}

/* Quantity & Actions */
.product-actions {
display: flex;
flex-direction: column;
gap: 1.5rem;
padding-top: 1.5rem;
border-top: 1px solid var(--brandia-border);
}

.quantity-selector {
display: flex;
align-items: center;
gap: 1rem;
}

.quantity-label {
font-weight: 600;
}

.quantity-control {
display: flex;
align-items: center;
background: var(--brandia-card);
border: 1px solid var(--brandia-border);
border-radius: 12px;
overflow: hidden;
}

.qty-btn {
width: 45px;
height: 45px;
background: transparent;
border: none;
color: var(--brandia-text);
cursor: pointer;
transition: all 0.3s;
font-size: 1.2rem;
}

.qty-btn:hover { background: var(--brandia-primary); }

.qty-input {
width: 60px;
height: 45px;
background: transparent;
border: none;
color: var(--brandia-text);
text-align: center;
font-weight: 700;
font-size: 1.1rem;
}

.action-buttons {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 1rem;
}

.btn-primary {
background: var(--brandia-gradient);
color: white;
border: none;
padding: 1rem 2rem;
border-radius: 12px;
font-weight: 700;
font-size: 1.1rem;
cursor: pointer;
transition: all 0.3s;
display: flex;
align-items: center;
justify-content: center;
gap: 0.5rem;
}

.btn-primary:hover {
transform: translateY(-3px);
box-shadow: 0 15px 40px rgba(99, 102, 241, 0.4);
}

.btn-primary:disabled {
opacity: 0.5;
cursor: not-allowed;
transform: none;
}

.btn-secondary {
background: var(--brandia-card);
color: var(--brandia-text);
padding: 1rem 2rem;
border: 2px solid var(--brandia-border);
border-radius: 12px;
font-weight: 700;
font-size: 1.1rem;
cursor: pointer;
transition: all 0.3s;
display: flex;
align-items: center;
justify-content: center;
gap: 0.5rem;
}

.btn-secondary:hover {
border-color: var(--brandia-secondary);
color: var(--brandia-secondary);
}

/* Trust Badges */
.trust-badges {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 1rem;
padding: 1.5rem;
background: var(--brandia-card);
border-radius: 16px;
border: 1px solid var(--brandia-border);
}

.trust-item {
display: flex;
align-items: center;
gap: 0.8rem;
font-size: 0.875rem;
color: var(--brandia-text-muted);
}

.trust-item i {
color: var(--brandia-success);
font-size: 1.2rem;
}

/* Tabs */
.tabs-section { margin-top: 4rem; }

.tabs-header {
display: flex;
gap: 2rem;
border-bottom: 1px solid var(--brandia-border);
margin-bottom: 2rem;
overflow-x: auto;
}

.tab-btn {
padding: 1rem 0;
background: transparent;
border: none;
color: var(--brandia-text-muted);
font-weight: 600;
cursor: pointer;
position: relative;
transition: all 0.3s;
white-space: nowrap;
}

.tab-btn.active { color: var(--brandia-primary); }

.tab-btn::after {
content: '';
position: absolute;
bottom: -1px;
left: 0;
width: 0;
height: 3px;
background: var(--brandia-gradient);
transition: width 0.3s;
}

.tab-btn.active::after { width: 100%; }

.tab-content { display: none; }
.tab-content.active { display: block; }

/* Specs Grid */
.specs-grid {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 1.5rem;
}

@media (max-width: 768px) {
.specs-grid { grid-template-columns: 1fr; }
}

.spec-item {
display: flex;
justify-content: space-between;
padding: 1rem;
background: var(--brandia-card);
border-radius: 12px;
border: 1px solid var(--brandia-border);
}

.spec-label { color: var(--brandia-text-muted); }
.spec-value { font-weight: 600; }

/* Related Products */
.related-section { margin-top: 6rem; }

.section-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 2rem;
flex-wrap: wrap;
gap: 1rem;
}

.section-title { font-size: 1.5rem; font-weight: 800; }

.view-all {
color: var(--brandia-primary);
text-decoration: none;
font-weight: 600;
display: flex;
align-items: center;
gap: 0.5rem;
}

.view-all:hover { color: var(--brandia-secondary); }

.products-grid {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 2rem;
}

@media (min-width: 768px) {
.products-grid { grid-template-columns: repeat(4, 1fr); }
}

.product-card {
background: var(--brandia-card);
border: 1px solid var(--brandia-border);
border-radius: 20px;
overflow: hidden;
transition: all 0.4s;
cursor: pointer;
}

.product-card:hover {
transform: translateY(-10px);
border-color: var(--brandia-primary);
}

.product-image-card {
position: relative;
aspect-ratio: 1;
overflow: hidden;
}

.product-image-card img {
width: 100%;
height: 100%;
object-fit: cover;
transition: transform 0.5s;
}

.product-card:hover .product-image-card img { transform: scale(1.1); }

.product-info-card { padding: 1.5rem; }

.product-name-card {
font-size: 1rem;
font-weight: 700;
margin-bottom: 0.5rem;
}

.product-price-card {
display: flex;
align-items: center;
gap: 0.5rem;
}

.price-current-card {
font-size: 1.25rem;
font-weight: 800;
color: var(--brandia-primary);
}

/* Loader */
.loader {
display: flex;
justify-content: center;
align-items: center;
min-height: 50vh;
}

.spinner {
width: 48px;
height: 48px;
border: 3px solid var(--brandia-border);
border-top-color: var(--brandia-primary);
border-radius: 50%;
animation: spin 1s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* Error State */
.error-state {
text-align: center;
padding: 4rem 2rem;
}

.error-state i {
font-size: 4rem;
color: var(--brandia-danger);
margin-bottom: 1rem;
}

/* Image Placeholder */
.image-placeholder {
width: 100%;
height: 100%;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
background: linear-gradient(135deg, var(--brandia-card), var(--brandia-darker));
color: var(--brandia-text-muted);
gap: 1rem;
}

.image-placeholder i { font-size: 3rem; opacity: 0.5; }

/* Toast */
.toast {
position: fixed;
bottom: 2rem;
right: 2rem;
background: var(--brandia-card);
border: 1px solid var(--brandia-border);
border-left: 4px solid var(--brandia-success);
border-radius: 12px;
padding: 1rem 1.5rem;
color: var(--brandia-text);
font-weight: 600;
box-shadow: 0 20px 40px rgba(0,0,0,0.3);
animation: slideIn 0.3s ease;
z-index: 1000;
}

@keyframes slideIn {
from { transform: translateX(100%); opacity: 0; }
to { transform: translateX(0); opacity: 1; }
}

/* Video Ad Overlay */
.video-ad-overlay {
position: fixed;
inset: 0;
background: rgba(0, 0, 0, 0.9);
z-index: 9999;
display: none;
align-items: center;
justify-content: center;
}

.video-ad-overlay.active { display: flex; }

.video-ad-container {
position: relative;
width: 90%;
max-width: 800px;
background: var(--brandia-card);
border-radius: 20px;
overflow: hidden;
}

.video-ad-close {
position: absolute;
top: 1rem;
right: 1rem;
background: rgba(0, 0, 0, 0.7);
color: white;
border: none;
width: 40px;
height: 40px;
border-radius: 50%;
cursor: pointer;
z-index: 10;
display: flex;
align-items: center;
justify-content: center;
}

.video-ad-content {
position: relative;
}

.video-ad-info {
padding: 1.5rem;
}

.video-ad-progress {
position: absolute;
bottom: 0;
left: 0;
right: 0;
height: 4px;
background: rgba(255, 255, 255, 0.3);
}

.video-ad-progress-bar {
height: 100%;
background: var(--brandia-primary);
width: 0%;
transition: width 0.1s linear;
}
</style>
</head>
<body>

<!-- Header -->
<header class="header">
<div class="container">
<div class="header-inner">
<a href="index.html" class="brandia-logo">
<div class="brandia-icon-bg">
<svg class="brandia-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
<path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
<line x1="3" y1="6" x2="21" y2="6"></line>
<path d="M16 10a4 4 0 0 1-8 0"></path>
</svg>
</div>
<span class="brandia-text">Brandia</span>
</a>
<a href="catalogue.html" style="color: var(--brandia-text); text-decoration: none;">

</div>
</div>
</header>

<!-- Main Content -->
<main class="container">
<!-- Breadcrumb -->
<nav class="breadcrumb" id="breadcrumb">
<a href="index.html">Accueil</a>
<i class="fas fa-chevron-right text-xs"></i>
<a href="catalogue.html">Catalogue</a>
<i class="fas fa-chevron-right text-xs"></i>

<!-- Product Section -->
<section class="product-section" id="product-section">

<!-- Tabs Section -->
<section class="tabs-section" id="tabs-section" style="display: none;">
<div class="tabs-header">

<button class="tab-btn" onclick="switchTab('specs')">Spécifications</button>

<!-- Related Products -->
<section class="related-section" id="related-section" style="display: none;">
<div class="section-header">

</div>

</section>
</main>

<!-- Video Ad Overlay -->
<div class="video-ad-overlay" id="video-ad-overlay">
<div class="video-ad-container">
<button class="video-ad-close" onclick="VideoAd.close()">
<i class="fas fa-times"></i>
</button>
<div class="video-ad-content">
<video id="video-ad-player" class="w-full" muted playsinline></video>
<div class="video-ad-progress">
<div class="video-ad-progress-bar" id="video-ad-progress"></div>
</div>
</div>
<div class="video-ad-info">
<h4 id="video-ad-brand" style="font-weight: 700; margin-bottom: 0.5rem;"></h4>
<p id="video-ad-headline" style="color: var(--brandia-text-muted); font-size: 0.875rem;"></p>
</div>
</div>
</div>

<!-- Toast Container -->
<div id="toast-container"></div>

<script>
// ============================================
// CONFIGURATION
// ============================================
const API_URL = 'https://brandia-1.onrender.com/api';
const DEFAULT_IMAGE = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iODAwIiBoZWlnaHQ9IjgwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjMWUyOTNiIi8+PHN2ZyB4PSI1MCUiIHk9IjUwJSIgdmlld0JveD0iMCAwIDI0IDI0IiB3aWR0aD0iODAiIGhlaWdodD0iODAiIGZpbGw9IiM2NDc0OGIiIHRyYW5zZm9ybT0idHJhbnNsYXRlKC00MCwgLTQwKSI+PHBhdGggZD0iTTIxIDE5VjVjMC0xLjEtLjktMi0yLTJINWMtMS4xIDAtMiAuOS0yIDJ2MTRjMCAxLjEuOSAyIDIgMmgxNGMxLjEgMCAyLS45IDItMnpNOC41IDEzLjVsMi41IDMuMDFMMTQuNSAxMmw0LjUgNmg1bC02LTgtNC41IDZ6Ii8+PC9zdmc+PC9zdmc+';

// ============================================
// ÉTAT GLOBAL
// ============================================
let currentProduct = null;
let currentProductId = null;
let cart = JSON.parse(localStorage.getItem('brandia_cart') || '[]');

// ============================================
// UTILITAIRES IMAGES
// ============================================
function getFallbackImage(width = 800, height = 800, text = 'Image') {
const svg = `<svg width="${width}" height="${height}" xmlns="http://www.w3.org/2000/svg">
<rect width="100%" height="100%" fill="#1e293b"/>
<text x="50%" y="50%" font-family="system-ui" font-size="20" fill="#64748b" text-anchor="middle" dy=".3em">${text}</text>
</svg>`;
return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
}

function getProductImageUrl(product) {
if (!product) return DEFAULT_IMAGE;
const fields = ['main_image_url', 'image_url', 'image', 'img_url', 'photo_url'];
for (let field of fields) {
if (product[field] && typeof product[field] === 'string' && product[field].trim() !== '') {
if (!product[field].startsWith('http') && !product[field].startsWith('data:')) {
return API_URL.replace('/api', '') + product[field];
}
return product[field];
}
}
return DEFAULT_IMAGE;
}

function handleImageError(img) {
img.src = DEFAULT_IMAGE;
img.onerror = null;
}

// ============================================
// INITIALISATION
// ============================================
document.addEventListener('DOMContentLoaded', function() {
console.log('[Product] Initialisation...');

// Récupérer l'ID depuis l'URL
const urlParams = new URLSearchParams(window.location.search);
currentProductId = urlParams.get('id');

console.log('[Product] ID:', currentProductId);

if (!currentProductId) {
showError('Produit non trouvé - ID manquant');
return;
}

// Charger le produit
loadProductData();
});

// ============================================
// CHARGEMENT PRODUIT
// ============================================
async function loadProductData() {
const section = document.getElementById('product-section');

try {
console.log('[Product] Chargement depuis:', `${API_URL}/products/${currentProductId}`);

const response = await fetch(`${API_URL}/products/${currentProductId}`);
console.log('[Product] Statut:', response.status);

if (!response.ok) {
throw new Error(`HTTP ${response.status}`);
}

const data = await response.json();
console.log('[Product] Données:', data);

if (!data.success || !data.data) {
throw new Error('Produit non trouvé');
}

currentProduct = data.data.product || data.data;
console.log('[Product] Produit chargé:', currentProduct.name);

// Afficher le produit
renderProduct(currentProduct);

// Charger produits similaires
if (currentProduct.category_id) {
loadRelatedProducts(currentProduct.category_id);
}

// Vérifier publicité vidéo
checkVideoAd(currentProduct);

} catch (error) {
console.error('[Product] Erreur:', error);
showError('Impossible de charger le produit: ' + error.message);
}
}

// ============================================
// RENDU PRODUIT
// ============================================
function renderProduct(product) {
const section = document.getElementById('product-section');
const loader = document.getElementById('product-loader');
const tabsSection = document.getElementById('tabs-section');
const relatedSection = document.getElementById('related-section');

// Masquer loader
loader.style.display = 'none';

// Afficher sections
tabsSection.style.display = 'block';
relatedSection.style.display = 'block';

// Image
const imageUrl = getProductImageUrl(product);
const hasDiscount = product.compare_price && parseFloat(product.compare_price) > parseFloat(product.price);
const discount = hasDiscount ? Math.round(((product.compare_price - product.price) / product.compare_price) * 100) : 0;

// HTML complet
section.innerHTML = `
<div class="product-gallery">
<div class="main-image">
<img src="${imageUrl}" alt="${product.name}" onerror="handleImageError(this)">
</div>
<div class="thumbnail-list">
<div class="thumbnail active" onclick="changeImage(this, '${imageUrl}')">
<img src="${imageUrl}" alt="Vue 1" onerror="handleImageError(this)">
</div>
</div>
</div>

<div class="product-info">
<div>
<span class="product-category">${product.category_name || product.category_slug || 'Catégorie'}</span>
<h1 class="product-title">${product.name || 'Produit sans nom'}</h1>
</div>

<div class="product-price">
<span class="current-price">${parseFloat(product.price).toFixed(2)} €</span>
${hasDiscount ? `
<span class="original-price">${parseFloat(product.compare_price).toFixed(2)} €</span>
<span class="discount-badge">-${discount}%</span>
` : ''}
</div>

<div class="product-description">
<h3 style="color: var(--brandia-text); margin-bottom: 1rem;">Description</h3>
<p>${product.description || 'Aucune description disponible'}</p>
</div>

<div class="product-meta">
<div class="meta-item">
<i class="fas fa-truck"></i>
<span class="meta-label">Livraison</span>
<span class="meta-value">Gratuite</span>
</div>
<div class="meta-item">
<i class="fas fa-shield-alt"></i>
<span class="meta-label">Garantie</span>
<span class="meta-value">2 ans</span>
</div>
<div class="meta-item">
<i class="fas fa-undo"></i>
<span class="meta-label">Retour</span>
<span class="meta-value">30 jours</span>
</div>
</div>

<div class="product-actions">
<div class="quantity-selector">
<span class="quantity-label">Quantité:</span>
<div class="quantity-control">
<button class="qty-btn" onclick="updateQty(-1)">-</button>
<input type="number" class="qty-input" value="1" min="1" max="10" id="qtyInput">
<button class="qty-btn" onclick="updateQty(1)">+</button>
</div>
</div>

<div class="action-buttons">
<button class="btn-primary" onclick="addToCart()" ${product.stock_quantity <= 0 ? 'disabled' : ''}>
<i class="fas fa-shopping-cart"></i>
${product.stock_quantity > 0 ? 'Ajouter au panier' : 'Indisponible'}
</button>
<button class="btn-secondary" onclick="toggleFavorite()">
<i class="far fa-heart" id="favorite-icon"></i>
Favoris
</button>
</div>
</div>

<div class="trust-badges">
<div class="trust-item">
<i class="fas fa-check-circle"></i>
<span>${product.stock_quantity > 0 ? product.stock_quantity + ' en stock' : 'Rupture'}</span>
</div>
<div class="trust-item">
<i class="fas fa-lock"></i>
<span>Paiement sécurisé</span>
</div>
<div class="trust-item">
<i class="fas fa-award"></i>
<span>Produit authentique</span>
</div>
</div>
</div>
`;

// Mettre à jour breadcrumb
document.getElementById('breadcrumb-category').textContent = product.category_name || product.category_slug || 'Catégorie';
document.getElementById('breadcrumb-product').textContent = product.name || 'Produit';

// Mettre à jour onglets
document.getElementById('tab-description').textContent = product.description || 'Aucune description';

// Spécifications
const specsGrid = document.getElementById('specs-grid');
specsGrid.innerHTML = `
<div class="spec-item">
<span class="spec-label">Référence</span>
<span class="spec-value">${product.sku || 'PRD-' + product.id}</span>
</div>
<div class="spec-item">
<span class="spec-label">Catégorie</span>
<span class="spec-value">${product.category_name || product.category_slug || '-'}</span>
</div>
<div class="spec-item">
<span class="spec-label">Disponibilité</span>
<span class="spec-value" style="color: ${product.stock_quantity > 0 ? 'var(--brandia-success)' : 'var(--brandia-danger)'}">
${product.stock_quantity > 0 ? 'En stock' : 'Rupture'}
</span>
</div>
`;

// Titre page
document.title = (product.name || 'Produit') + ' - Brandia';
}

// ============================================
// PRODUITS SIMILAIRES
// ============================================
async function loadRelatedProducts(categoryId) {
if (!categoryId) return;

try {
const response = await fetch(`${API_URL}/products?category=${categoryId}&limit=4`);
const data = await response.json();

if (data.success && data.data) {
const products = (Array.isArray(data.data) ? data.data : (data.data.products || []))
.filter(p => p.id != currentProductId)
.slice(0, 4);

renderRelatedProducts(products);
}
} catch (error) {
console.error('[Product] Erreur produits similaires:', error);
}
}

function renderRelatedProducts(products) {
const container = document.getElementById('related-products');

if (products.length === 0) {
container.innerHTML = '<p style="color: var(--brandia-text-muted); text-align: center; grid-column: 1/-1;">Aucun produit similaire</p>';
return;
}

container.innerHTML = products.map(p => {
const hasDiscount = p.compare_price && parseFloat(p.compare_price) > parseFloat(p.price);
const discount = hasDiscount ? Math.round(((p.compare_price - p.price) / p.compare_price) * 100) : 0;
const imageUrl = getProductImageUrl(p);

return `
<div class="product-card" onclick="window.location.href='product.html?id=${p.id}'">
<div class="product-image-card">
${hasDiscount ? `<span style="position: absolute; top: 0.75rem; left: 0.75rem; background: var(--brandia-danger); color: white; padding: 0.25rem 0.5rem; border-radius: 20px; font-size: 0.75rem; font-weight: 700;">-${discount}%</span>` : ''}
<img src="${imageUrl}" alt="${p.name}" onerror="handleImageError(this)">
</div>
<div class="product-info-card">
<div class="product-name-card">${p.name}</div>
<div class="product-price-card">
<span class="price-current-card">${parseFloat(p.price).toFixed(2)} €</span>
${hasDiscount ? `<span style="color: var(--brandia-text-muted); text-decoration: line-through; font-size: 0.875rem;">${parseFloat(p.compare_price).toFixed(2)} €</span>` : ''}
</div>
</div>
</div>
`;
}).join('');
}

// ============================================
// INTERACTIONS
// ============================================
function changeImage(thumbnail, src) {
document.getElementById('mainImage').src = src;
document.querySelectorAll('.thumbnail').forEach(t => t.classList.remove('active'));
thumbnail.classList.add('active');
}

function updateQty(change) {
const input = document.getElementById('qtyInput');
const value = parseInt(input.value) + change;
if (value >= 1 && value <= 10) input.value = value;
}

function addToCart() {
if (!currentProduct) return;

const qty = parseInt(document.getElementById('qtyInput').value);
const existing = cart.find(item => item.id === currentProduct.id);

if (existing) {
existing.quantity += qty;
} else {
cart.push({
id: currentProduct.id,
name: currentProduct.name,
price: parseFloat(currentProduct.price),
main_image_url: getProductImageUrl(currentProduct),
quantity: qty
});
}

localStorage.setItem('brandia_cart', JSON.stringify(cart));

// Feedback
const btn = document.getElementById('add-to-cart-btn');
const original = btn.innerHTML;
btn.innerHTML = '<i class="fas fa-check"></i> Ajouté !';
btn.style.background = 'linear-gradient(135deg, var(--brandia-success), #059669)';
setTimeout(() => {
btn.innerHTML = original;
btn.style.background = '';
}, 2000);

showToast('Produit ajouté au panier !');
}

function toggleFavorite() {
let favorites = JSON.parse(localStorage.getItem('brandia_favorites') || '[]');
const index = favorites.indexOf(currentProduct.id);

if (index > -1) {
favorites.splice(index, 1);
showToast('Retiré des favoris');
} else {
favorites.push(currentProduct.id);
showToast('Ajouté aux favoris');
}

localStorage.setItem('brandia_favorites', JSON.stringify(favorites));

const icon = document.getElementById('favorite-icon');
icon.className = index > -1 ? 'far fa-heart' : 'fas fa-heart';
icon.style.color = index > -1 ? '' : 'var(--brandia-secondary)';
}

function switchTab(tabName) {
document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

event.target.classList.add('active');
document.getElementById(tabName).classList.add('active');
}

function showError(message) {
document.querySelector('.container').innerHTML = `
<div class="error-state">
<i class="fas fa-exclamation-circle"></i>
<h2 style="margin-bottom: 1rem;">${message}</h2>
<a href="catalogue.html" style="color: var(--brandia-primary); text-decoration: none;">
<i class="fas fa-arrow-left" style="margin-right: 0.5rem;"></i>Retour au catalogue
</a>
</div>
`;
}

function showToast(message) {
const toast = document.createElement('div');
toast.className = 'toast';
toast.innerHTML = `<i class="fas fa-check-circle" style="margin-right: 0.5rem;"></i>${message}`;
document.body.appendChild(toast);
setTimeout(() => toast.remove(), 3000);
}

// ============================================
// VIDEO AD SYSTEM (15s, 1x/session, skippable)
// ============================================
const VideoAd = {
SESSION_KEY: 'brandia_video_ad_seen',

canShow: function() {
return !sessionStorage.getItem(VideoAd.SESSION_KEY);
},

markAsSeen: function() {
sessionStorage.setItem(VideoAd.SESSION_KEY, 'true');
},

check: async function(product) {
if (!VideoAd.canShow()) return;

try {
const supplierId = product.supplier_id;
if (!supplierId) return;

const response = await fetch(`${API_URL}/supplier/public/campaigns?supplier=${supplierId}&product=${product.id}`);
const data = await response.json();

if (data.success && data.data) {
VideoAd.show(data.data);
}
} catch (error) {
console.error('[VideoAd] Erreur:', error);
}
},

show: function(campaign) {
const overlay = document.getElementById('video-ad-overlay');
const player = document.getElementById('video-ad-player');
const progress = document.getElementById('video-ad-progress');
const brand = document.getElementById('video-ad-brand');
const headline = document.getElementById('video-ad-headline');

if (!overlay || !player) return;

// Charger vidéo
player.src = campaign.media_url;
brand.textContent = campaign.headline || 'Offre spéciale';
headline.textContent = campaign.description || 'Découvrez nos produits';

// Afficher
overlay.classList.add('active');
VideoAd.markAsSeen();

// Lancer
player.play().catch(e => console.log('Autoplay bloqué:', e));

// Progress bar
let duration = 15;
let elapsed = 0;
const interval = setInterval(() => {
elapsed++;
const percent = (elapsed / duration) * 100;
progress.style.width = percent + '%';

if (elapsed >= duration) {
clearInterval(interval);
VideoAd.close();
}
}, 1000);

// Track view
fetch(`${API_URL}/supplier/public/campaigns/view`, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ campaign_id: campaign.id })
}).catch(e => {});
},

close: function() {
const overlay = document.getElementById('video-ad-overlay');
const player = document.getElementById('video-ad-player');

if (overlay) overlay.classList.remove('active');
if (player) {
player.pause();
player.src = '';
}
}
};

function checkVideoAd(product) {
VideoAd.check(product);
}

// ============================================
// HEADER SCROLL EFFECT
// ============================================
window.addEventListener('scroll', function() {
const header = document.querySelector('.header');
if (window.scrollY > 50) {
header.style.background = 'rgba(15, 23, 42, 0.98)';
} else {
header.style.background = 'rgba(15, 23, 42, 0.95)';
}
});

console.log('[Product] Script chargé');
</script>
