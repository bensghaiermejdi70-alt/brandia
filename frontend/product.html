<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produit - Brandia</title>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
darkMode: 'class',
theme: {
extend: {
colors: {
brandia: {
primary: '#6366f1',
secondary: '#8b5cf6',
accent: '#ec4899',
dark: '#0f172a',
darker: '#020617',
card: '#1e293b',
border: '#334155',
text: '#f8fafc',
muted: '#94a3b8',
success: '#10b981',
warning: '#f59e0b',
danger: '#ef4444',
},
},
fontFamily: {
sans: ['Inter', 'system-ui', 'sans-serif'],
}
}
}
}
</script>

<!-- Fonts & Icons -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
--brandia-primary: #6366f1;
--brandia-primary-hover: #4f46e5;
--brandia-secondary: #8b5cf6;
--brandia-accent: #ec4899;
--brandia-dark: #0f172a;
--brandia-darker: #020617;
--brandia-card: #1e293b;
--brandia-border: #334155;
--brandia-text: #f8fafc;
--brandia-text-muted: #94a3b8;
--brandia-success: #10b981;
--brandia-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
font-family: 'Inter', system-ui, sans-serif;
background-color: var(--brandia-darker);
color: var(--brandia-text);
line-height: 1.6;
}

.container {
max-width: 1400px;
margin: 0 auto;
padding: 0 2rem;
}

/* Header */
.header {
position: sticky;
top: 0;
z-index: 50;
background: rgba(15, 23, 42, 0.95);
backdrop-filter: blur(12px);
border-bottom: 1px solid var(--brandia-border);
padding: 1rem 0;
}

.header-inner {
display: flex;
align-items: center;
justify-content: space-between;
}

.brandia-logo {
display: flex;
align-items: center;
gap: 0.75rem;
text-decoration: none;
}

.brandia-icon-bg {
width: 40px;
height: 40px;
border-radius: 10px;
background: var(--brandia-gradient);
display: flex;
align-items: center;
justify-content: center;
}

.brandia-icon-svg {
width: 24px;
height: 24px;
color: white;
}

.brandia-text {
font-family: 'Outfit', sans-serif;
font-size: 1.5rem;
font-weight: 800;
background: var(--brandia-gradient);
-webkit-background-clip: text;
background-clip: text;
-webkit-text-fill-color: transparent;
}

/* Product Section */
.product-section {
display: grid;
grid-template-columns: 1fr;
gap: 3rem;
padding: 3rem 0;
}

@media (min-width: 1024px) {
.product-section {
grid-template-columns: 1fr 1fr;
}
}

/* Gallery */
.product-gallery {
position: sticky;
top: 100px;
}

.main-image {
width: 100%;
aspect-ratio: 1;
background: var(--brandia-card);
border: 1px solid var(--brandia-border);
border-radius: 20px;
overflow: hidden;
margin-bottom: 1rem;
display: flex;
align-items: center;
justify-content: center;
}

.main-image img {
width: 100%;
height: 100%;
object-fit: cover;
}

/* Product Info */
.product-info {
display: flex;
flex-direction: column;
gap: 1.5rem;
}

.product-category {
display: inline-block;
background: rgba(99, 102, 241, 0.2);
color: var(--brandia-primary);
padding: 0.4rem 1rem;
border-radius: 50px;
font-size: 0.85rem;
font-weight: 600;
}

.product-title {
font-size: 2rem;
font-weight: 800;
line-height: 1.2;
}

.product-price {
display: flex;
align-items: baseline;
gap: 1rem;
}

.current-price {
font-size: 2.5rem;
font-weight: 800;
background: var(--brandia-gradient);
-webkit-background-clip: text;
background-clip: text;
-webkit-text-fill-color: transparent;
}

.original-price {
font-size: 1.5rem;
color: var(--brandia-text-muted);
text-decoration: line-through;
}

.discount-badge {
background: var(--brandia-success);
color: white;
padding: 0.3rem 0.8rem;
border-radius: 50px;
font-weight: 700;
}

.product-description {
color: var(--brandia-text-muted);
line-height: 1.8;
}

/* Buttons */
.btn-primary {
background: var(--brandia-gradient);
color: white;
border: none;
padding: 1rem 2rem;
border-radius: 12px;
font-weight: 700;
font-size: 1.1rem;
cursor: pointer;
transition: all 0.3s;
display: flex;
align-items: center;
justify-content: center;
gap: 0.5rem;
}

.btn-primary:hover {
transform: translateY(-2px);
box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
}

/* Loader */
.loader {
display: flex;
justify-content: center;
align-items: center;
min-height: 50vh;
}

.spinner {
width: 48px;
height: 48px;
border: 3px solid var(--brandia-border);
border-top-color: var(--brandia-primary);
border-radius: 50%;
animation: spin 1s linear infinite;
}

@keyframes spin {
to { transform: rotate(360deg); }
}

/* Error State */
.error-state {
text-align: center;
padding: 4rem 2rem;
}

.error-state i {
font-size: 4rem;
color: var(--brandia-danger);
margin-bottom: 1rem;
}

/* Image Placeholder */
.image-placeholder {
width: 100%;
height: 100%;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
background: linear-gradient(135deg, var(--brandia-card) 0%, var(--brandia-darker) 100%);
color: var(--brandia-text-muted);
gap: 1rem;
}

.image-placeholder i {
font-size: 4rem;
opacity: 0.5;
}

/* Toast */
.toast {
position: fixed;
bottom: 2rem;
right: 2rem;
background: var(--brandia-card);
border: 1px solid var(--brandia-border);
border-left: 4px solid var(--brandia-success);
border-radius: 12px;
padding: 1rem 1.5rem;
color: var(--brandia-text);
font-weight: 600;
box-shadow: 0 20px 40px rgba(0,0,0,0.3);
animation: slideIn 0.3s ease;
z-index: 1000;
}

@keyframes slideIn {
from { transform: translateX(100%); opacity: 0; }
to { transform: translateX(0); opacity: 1; }
}
</style>
</head>
<body>

<!-- Header -->
<header class="header">
<div class="container">
<div class="header-inner">
<a href="index.html" class="brandia-logo">
<div class="brandia-icon-bg">
<svg class="brandia-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
<path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
<line x1="3" y1="6" x2="21" y2="6"></line>
<path d="M16 10a4 4 0 0 1-8 0"></path>
</svg>
</div>
<span class="brandia-text">Brandia</span>
</a>
<a href="catalogue.html" style="color: var(--brandia-text); text-decoration: none;">
<i class="fas fa-arrow-left" style="margin-right: 0.5rem;"></i>Retour au catalogue
</a>
</div>
</div>
</header>

<!-- Main Content -->
<main class="container">
<div id="product-container">
<div class="loader">
<div class="spinner"></div>
</div>
</div>
</main>

<script>
// ============================================
// CONFIGURATION
// ============================================
const API_URL = 'https://brandia-1.onrender.com/api';
const DEFAULT_IMAGE = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iODAwIiBoZWlnaHQ9IjgwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjMWUyOTNiIi8+PHN2ZyB4PSI1MCUiIHk9IjUwJSIgdmlld0JveD0iMCAwIDI0IDI0IiB3aWR0aD0iODAiIGhlaWdodD0iODAiIGZpbGw9IiM2NDc0OGIiIHRyYW5zZm9ybT0idHJhbnNsYXRlKC00MCwgLTQwKSI+PHBhdGggZD0iTTIxIDE5VjVjMC0xLjEtLjktMi0yLTJINWMtMS4xIDAtMiAuOS0yIDJ2MTRjMCAxLjEuOSAyIDIgMmgxNGMxLjEgMCAyLS45IDItMnpNOC41IDEzLjVsMi41IDMuMDFMMTQuNSAxMmw0LjUgNmg1bC02LTgtNC41IDZ6Ii8+PC9zdmc+PC9zdmc+';

// ============================================
// ÉTAT GLOBAL
// ============================================
let currentProduct = null;
let currentProductId = null;

// ============================================
// INITIALISATION
// ============================================
document.addEventListener('DOMContentLoaded', () => {
console.log('[Product] Initialisation...');

// Récupérer l'ID depuis l'URL
const urlParams = new URLSearchParams(window.location.search);
currentProductId = urlParams.get('id');

console.log('[Product] ID du produit:', currentProductId);

if (!currentProductId) {
showError('Produit non trouvé - ID manquant dans l\'URL');
return;
}

// Charger les données
loadProductData();
});

// ============================================
// CHARGEMENT PRODUIT
// ============================================
async function loadProductData() {
const container = document.getElementById('product-container');

try {
console.log('[Product] Chargement depuis:', `${API_URL}/products/${currentProductId}`);

const response = await fetch(`${API_URL}/products/${currentProductId}`);
console.log('[Product] Statut HTTP:', response.status);

if (!response.ok) {
throw new Error(`HTTP ${response.status}: ${response.statusText}`);
}

const data = await response.json();
console.log('[Product] Données reçues:', data);

if (!data.success || !data.data) {
throw new Error('Produit non trouvé dans la réponse API');
}

currentProduct = data.data.product || data.data;
console.log('[Product] Produit chargé:', currentProduct);

renderProduct(currentProduct);

} catch (error) {
console.error('[Product] Erreur:', error);
showError(`Impossible de charger le produit: ${error.message}`);
}
}

// ============================================
// RENDU PRODUIT
// ============================================
function renderProduct(product) {
const container = document.getElementById('product-container');

// Gestion image
const imageUrl = getProductImageUrl(product);
const hasDiscount = product.compare_price && product.compare_price > product.price;
const discount = hasDiscount ? Math.round(((product.compare_price - product.price) / product.compare_price) * 100) : 0;

container.innerHTML = `
<div class="product-section">
<div class="product-gallery">
<div class="main-image">
<img src="${imageUrl}" alt="${product.name}" onerror="handleImageError(this)">
</div>
</div>

<div class="product-info">
<div>
<span class="product-category">${product.category_name || product.category_slug || 'Catégorie'}</span>
<h1 class="product-title" style="margin-top: 1rem;">${product.name || 'Produit sans nom'}</h1>
</div>

<div class="product-price">
<span class="current-price">${parseFloat(product.price).toFixed(2)} €</span>
${hasDiscount ? `
<span class="original-price">${parseFloat(product.compare_price).toFixed(2)} €</span>
<span class="discount-badge">-${discount}%</span>
` : ''}
</div>

<div class="product-description">
<h3 style="color: var(--brandia-text); margin-bottom: 1rem;">Description</h3>
<p>${product.description || 'Aucune description disponible'}</p>
</div>

<div style="background: var(--brandia-card); border: 1px solid var(--brandia-border); border-radius: 16px; padding: 1.5rem;">
<h3 style="color: var(--brandia-text); margin-bottom: 1rem;">Informations</h3>
<div style="display: grid; gap: 1rem;">
<div style="display: flex; justify-content: space-between; padding: 0.75rem; background: var(--brandia-darker); border-radius: 8px;">
<span style="color: var(--brandia-text-muted);">Référence</span>
<span style="font-weight: 600;">${product.sku || 'N/A'}</span>
</div>
<div style="display: flex; justify-content: space-between; padding: 0.75rem; background: var(--brandia-darker); border-radius: 8px;">
<span style="color: var(--brandia-text-muted);">Stock</span>
<span style="font-weight: 600; color: ${product.stock_quantity > 0 ? 'var(--brandia-success)' : 'var(--brandia-danger)'};">
${product.stock_quantity > 0 ? `${product.stock_quantity} disponibles` : 'Rupture de stock'}
</span>
</div>
</div>
</div>

<button class="btn-primary" onclick="addToCart()" ${product.stock_quantity <= 0 ? 'disabled style="opacity: 0.5; cursor: not-allowed;"' : ''}>
<i class="fas fa-shopping-cart"></i>
${product.stock_quantity > 0 ? 'Ajouter au panier' : 'Indisponible'}
</button>
</div>
</div>
`;
}

function getProductImageUrl(product) {
if (!product) return DEFAULT_IMAGE;

const fields = ['main_image_url', 'image_url', 'image', 'img_url', 'photo_url'];

for (let field of fields) {
if (product[field] && typeof product[field] === 'string' && product[field].trim() !== '') {
if (!product[field].startsWith('http') && !product[field].startsWith('data:')) {
return API_URL.replace('/api', '') + product[field];
}
return product[field];
}
}

return DEFAULT_IMAGE;
}

function handleImageError(img) {
console.warn('[Product] Image non chargée:', img.src);
img.src = DEFAULT_IMAGE;
img.onerror = null;
}

function showError(message) {
const container = document.getElementById('product-container');
container.innerHTML = `
<div class="error-state">
<i class="fas fa-exclamation-circle"></i>
<h2 style="margin-bottom: 1rem; color: var(--brandia-text);">Erreur</h2>
<p style="color: var(--brandia-text-muted); margin-bottom: 2rem;">${message}</p>
<a href="catalogue.html" style="color: var(--brandia-primary); text-decoration: none; font-weight: 600;">
<i class="fas fa-arrow-left" style="margin-right: 0.5rem;"></i>Retour au catalogue
</a>
</div>
`;
}

function showToast(message) {
const toast = document.createElement('div');
toast.className = 'toast';
toast.innerHTML = `<i class="fas fa-check-circle" style="margin-right: 0.5rem;"></i>${message}`;
document.body.appendChild(toast);
setTimeout(() => toast.remove(), 3000);
}

function addToCart() {
if (!currentProduct) return;

const cartItem = {
id: currentProduct.id,
name: currentProduct.name,
price: parseFloat(currentProduct.price),
main_image_url: getProductImageUrl(currentProduct),
quantity: 1
};

let cart = JSON.parse(localStorage.getItem('brandia_cart') || '[]');
const existing = cart.find(item => item.id === cartItem.id);

if (existing) {
existing.quantity++;
} else {
cart.push(cartItem);
}

localStorage.setItem('brandia_cart', JSON.stringify(cart));
showToast('Produit ajouté au panier !');
}
</script>

</body>
</html>
