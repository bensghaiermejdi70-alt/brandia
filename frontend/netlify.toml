[build]
  publish = "."
  command = "echo 'Build complete'"

[build.environment]
  CI = "false"

# Désactive les functions pour débloquer
[functions]
  directory = "netlify/functions"
  node_bundler = "none"

# Redirections API
[[redirects]]
  from = "/api/*"
  to = "https://brandia-1.onrender.com/api/:splat"
  status = 200
  force = true

# SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200