<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalogue - Brandia</title>
<meta name="description" content="Découvrez tous les produits des marques sur Brandia">

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
darkMode: 'class',
theme: {
extend: {
colors: {
brandia: {
primary: '#6366f1',
secondary: '#8b5cf6',
accent: '#ec4899',
dark: '#0f172a',
darker: '#020617',
card: '#1e293b',
border: '#334155',
text: '#f8fafc',
muted: '#94a3b8',
success: '#10b981',
warning: '#f59e0b',
danger: '#ef4444',
},
},
fontFamily: {
sans: ['Inter', 'system-ui', 'sans-serif'],
}
}
}
}
</script>

<!-- Fonts & Icons -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
--brandia-primary: #6366f1;
--brandia-primary-hover: #4f46e5;
--brandia-secondary: #8b5cf6;
--brandia-accent: #ec4899;
--brandia-dark: #0f172a;
--brandia-darker: #020617;
--brandia-card: #1e293b;
--brandia-card-hover: #334155;
--brandia-border: #334155;
--brandia-text: #f8fafc;
--brandia-text-muted: #94a3b8;
--brandia-success: #10b981;
--brandia-warning: #f59e0b;
--brandia-danger: #ef4444;
--brandia-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
font-family: 'Inter', system-ui, sans-serif;
background-color: var(--brandia-dark);
color: var(--brandia-text);
line-height: 1.6;
overflow-x: hidden;
min-width: 320px;
}

.container {
width: 100%;
max-width: 1280px;
margin: 0 auto;
padding: 0 1.5rem;
}

/* Header Styles */
.header {
position: sticky;
top: 0;
z-index: 50;
background: rgba(15, 23, 42, 0.95);
backdrop-filter: blur(12px);
border-bottom: 1px solid var(--brandia-border);
}

.header-inner {
display: flex;
align-items: center;
justify-content: space-between;
padding: 0.75rem 0;
gap: 1rem;
}

.brandia-logo {
display: flex;
align-items: center;
gap: 0.75rem;
text-decoration: none;
transition: transform 0.3s ease;
}

.brandia-logo:hover {
transform: scale(1.02);
}

.brandia-icon-bg {
width: 40px;
height: 40px;
border-radius: 10px;
background: var(--brandia-gradient);
display: flex;
align-items: center;
justify-content: center;
box-shadow: 0 8px 32px -8px rgba(99, 102, 241, 0.5);
}

.brandia-icon-svg {
width: 24px;
height: 24px;
color: white;
}

.brandia-text {
font-family: 'Outfit', sans-serif;
font-size: 1.5rem;
font-weight: 800;
background: var(--brandia-gradient);
-webkit-background-clip: text;
background-clip: text;
-webkit-text-fill-color: transparent;
}

.nav-desktop {
display: none;
align-items: center;
gap: 2rem;
}

@media (min-width: 1024px) {
.nav-desktop {
display: flex;
}
}

.nav-link {
color: var(--brandia-text-muted);
text-decoration: none;
font-size: 0.875rem;
font-weight: 500;
transition: all 0.2s;
}

.nav-link:hover {
color: var(--brandia-text);
}

/* Products Grid */
.products-grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
gap: 1.5rem;
padding: 2rem 0;
}

.product-card {
background: var(--brandia-card);
border: 1px solid var(--brandia-border);
border-radius: 16px;
overflow: hidden;
transition: all 0.3s;
cursor: pointer;
}

.product-card:hover {
transform: translateY(-4px);
border-color: var(--brandia-primary);
box-shadow: 0 20px 40px -10px rgba(99, 102, 241, 0.3);
}

.product-image {
position: relative;
aspect-ratio: 1;
overflow: hidden;
background: var(--brandia-darker);
}

.product-image img {
width: 100%;
height: 100%;
object-fit: cover;
transition: transform 0.5s;
}

.product-card:hover .product-image img {
transform: scale(1.05);
}

.product-badge {
position: absolute;
top: 0.75rem;
left: 0.75rem;
background: var(--brandia-danger);
color: white;
font-size: 0.75rem;
font-weight: 700;
padding: 0.375rem 0.75rem;
border-radius: 20px;
z-index: 2;
}

.product-info {
padding: 1.25rem;
}

.product-category {
color: var(--brandia-primary);
font-size: 0.75rem;
font-weight: 600;
text-transform: uppercase;
letter-spacing: 0.05em;
margin-bottom: 0.5rem;
}

.product-name {
color: var(--brandia-text);
font-weight: 600;
margin-bottom: 0.75rem;
line-height: 1.4;
}

.product-price {
display: flex;
align-items: center;
gap: 0.5rem;
}

.price-current {
font-family: 'Outfit', sans-serif;
font-size: 1.25rem;
font-weight: 700;
color: var(--brandia-success);
}

.price-original {
color: var(--brandia-text-muted);
font-size: 0.875rem;
text-decoration: line-through;
}

/* Loader */
.loader {
display: flex;
justify-content: center;
padding: 3rem;
}

.spinner {
width: 48px;
height: 48px;
border: 3px solid var(--brandia-border);
border-top-color: var(--brandia-primary);
border-radius: 50%;
animation: spin 1s linear infinite;
}

@keyframes spin {
to { transform: rotate(360deg); }
}

/* Empty State */
.empty-state {
text-align: center;
padding: 4rem 2rem;
}

.empty-state-icon {
font-size: 4rem;
color: var(--brandia-border);
margin-bottom: 1rem;
}

/* Toast */
.toast-container {
position: fixed;
bottom: 1.5rem;
right: 1.5rem;
z-index: 1000;
display: flex;
flex-direction: column;
gap: 0.75rem;
}

.toast {
background: var(--brandia-card);
border: 1px solid var(--brandia-border);
border-left: 4px solid var(--brandia-primary);
border-radius: 12px;
padding: 1rem 1.5rem;
color: var(--brandia-text);
font-size: 0.875rem;
font-weight: 500;
display: flex;
align-items: center;
gap: 0.75rem;
box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
animation: slideIn 0.3s ease;
}

@keyframes slideIn {
from { transform: translateX(100%); opacity: 0; }
to { transform: translateX(0); opacity: 1; }
}

.toast.success { border-left-color: var(--brandia-success); }
.toast.error { border-left-color: var(--brandia-danger); }

/* Image Placeholder */
.img-placeholder {
width: 100%;
height: 100%;
display: flex;
align-items: center;
justify-content: center;
background: linear-gradient(135deg, var(--brandia-card) 0%, var(--brandia-card-hover) 100%);
color: var(--brandia-text-muted);
font-size: 3rem;
}
</style>
</head>
<body>

<!-- Header -->
<header class="header">
<div class="container">
<div class="header-inner">
<a href="index.html" class="brandia-logo">
<div class="brandia-icon-bg">
<svg class="brandia-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
<path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
<line x1="3" y1="6" x2="21" y2="6"></line>
<path d="M16 10a4 4 0 0 1-8 0"></path>
</svg>
</div>
<span class="brandia-text">Brandia</span>
</a>

<nav class="nav-desktop">
<a href="index.html" class="nav-link">Accueil</a>
<a href="catalogue.html" class="nav-link" style="color: var(--brandia-text);">Catalogue</a>
<a href="categories.html" class="nav-link">Catégories</a>
</nav>

<div style="display: flex; align-items: center; gap: 1rem;">
<a href="panier.html" style="position: relative; color: var(--brandia-text); text-decoration: none;">
<i class="fas fa-shopping-bag text-xl"></i>
<span class="cart-badge" id="cart-count" style="position: absolute; top: -8px; right: -8px; background: var(--brandia-primary); color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 0.625rem; font-weight: 700; display: flex; align-items: center; justify-content: center;">0</span>
</a>
</div>
</div>
</div>
</header>

<!-- Main Content -->
<main class="container">
<div style="padding: 2rem 0;">
<h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem;">Catalogue</h1>
<p style="color: var(--brandia-text-muted);" id="results-count">Chargement des produits...</p>
</div>

<div id="products-container" class="products-grid">
<div class="loader">
<div class="spinner"></div>
</div>
</div>

<div id="empty-state" class="empty-state" style="display: none;">
<i class="fas fa-search empty-state-icon"></i>
<h3 style="font-size: 1.25rem; margin-bottom: 0.5rem;">Aucun produit trouvé</h3>
<p style="color: var(--brandia-text-muted);">Essayez de modifier vos filtres ou votre recherche</p>
</div>
</main>

<!-- Toast Container -->
<div class="toast-container" id="toast-container"></div>

<!-- Scripts -->
<script>
// ============================================
// CONFIGURATION
// ============================================
const API_URL = 'https://brandia-1.onrender.com/api';
const DEFAULT_PRODUCT_IMAGE = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAwIiBoZWlnaHQ9IjQwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjMWUyOTNiIi8+PHN2ZyB4PSI1MCUiIHk9IjUwJSIgdmlld0JveD0iMCAwIDI0IDI0IiB3aWR0aD0iNDgiIGhlaWdodD0iNDgiIGZpbGw9IiM2NDc0OGIiIHRyYW5zZm9ybT0idHJhbnNsYXRlKC0yNCwgLTI0KSI+PHBhdGggZD0iTTIxIDE5VjVjMC0xLjEtLjktMi0yLTJINWMtMS4xIDAtMiAuOS0yIDJ2MTRjMCAxLjEuOSAyIDIgMmgxNGMxLjEgMCAyLS45IDItMnpNOC41IDEzLjVsMi41IDMuMDFMMTQuNSAxMmw0LjUgNmg1bC02LTgtNC41IDZ6Ii8+PC9zdmc+PC9zdmc+';

// ============================================
// UTILITAIRES
// ============================================
function getProductImageUrl(product) {
if (!product) return DEFAULT_PRODUCT_IMAGE;

const possibleFields = [
'main_image_url', 'image_url', 'image', 'img_url',
'photo_url', 'picture_url', 'thumbnail_url', 'cover_image'
];

for (let field of possibleFields) {
if (product[field] && typeof product[field] === 'string' && product[field].trim() !== '') {
// Si l'URL ne commence pas par http, ajouter l'URL de base si nécessaire
if (!product[field].startsWith('http') && !product[field].startsWith('data:')) {
return API_URL.replace('/api', '') + product[field];
}
return product[field];
}
}

return DEFAULT_PRODUCT_IMAGE;
}

function formatPrice(price, currency = 'EUR') {
return new Intl.NumberFormat('fr-FR', { style: 'currency', currency }).format(price || 0);
}

function showToast(message, type = 'success') {
const container = document.getElementById('toast-container');
const toast = document.createElement('div');
toast.className = `toast ${type}`;
toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i><span>${message}</span>`;
container.appendChild(toast);
setTimeout(() => toast.remove(), 3000);
}

function updateCartBadge() {
const cart = JSON.parse(localStorage.getItem('brandia_cart') || '[]');
const count = cart.reduce((sum, item) => sum + (item.quantity || 0), 0);
const badge = document.getElementById('cart-count');
if (badge) {
badge.textContent = count > 99 ? '99+' : count;
badge.style.display = count === 0 ? 'none' : 'flex';
}
}

// ============================================
// CHARGEMENT PRODUITS
// ============================================
async function loadProducts() {
const container = document.getElementById('products-container');
const resultsCount = document.getElementById('results-count');
const emptyState = document.getElementById('empty-state');

try {
console.log('[Catalogue] Chargement des produits depuis:', API_URL);

const response = await fetch(`${API_URL}/products?limit=100`);
console.log('[Catalogue] Réponse HTTP:', response.status);

if (!response.ok) {
throw new Error(`HTTP ${response.status}: ${response.statusText}`);
}

const data = await response.json();
console.log('[Catalogue] Données reçues:', data);

let products = [];

if (data.success) {
products = data.data?.products || data.data || [];
} else if (Array.isArray(data)) {
products = data;
} else {
throw new Error('Format de données invalide');
}

console.log('[Catalogue] Nombre de produits:', products.length);

if (products.length === 0) {
container.innerHTML = '';
emptyState.style.display = 'block';
resultsCount.textContent = 'Aucun produit disponible';
return;
}

emptyState.style.display = 'none';
resultsCount.textContent = `${products.length} produit(s) disponible(s)`;

// Rendu des produits
container.innerHTML = products.map((product, index) => renderProductCard(product, index)).join('');

} catch (error) {
console.error('[Catalogue] Erreur:', error);
container.innerHTML = `
<div class="empty-state">
<i class="fas fa-exclamation-circle empty-state-icon" style="color: var(--brandia-danger);"></i>
<h3>Erreur de chargement</h3>
<p style="color: var(--brandia-text-muted); margin: 1rem 0;">${error.message}</p>
<button onclick="loadProducts()" style="background: var(--brandia-primary); color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; cursor: pointer; font-weight: 600;">
<i class="fas fa-redo" style="margin-right: 0.5rem;"></i>Réessayer
</button>
</div>
`;
resultsCount.textContent = 'Erreur de chargement';
}
}

function renderProductCard(product, index) {
const hasPromo = product.has_promotion || (product.compare_price && product.compare_price > product.price);
const finalPrice = parseFloat(product.final_price || product.price);
const basePrice = hasPromo ? parseFloat(product.base_price || product.original_price || product.compare_price || product.price) : finalPrice;
const discount = hasPromo && basePrice > finalPrice ? Math.round(((basePrice - finalPrice) / basePrice) * 100) : 0;

const imageUrl = getProductImageUrl(product);
const categoryName = product.category_name || product.category_slug || 'Catégorie';
const productName = product.name || 'Produit sans nom';

return `
<div class="product-card" onclick="goToProduct(${product.id})" style="animation: fadeIn 0.5s ease ${index * 0.05}s both;">
<div class="product-image">
<img src="${imageUrl}" alt="${productName}" loading="lazy" onerror="handleImageError(this)">
${hasPromo ? `<div class="product-badge">-${discount}%</div>` : ''}
</div>
<div class="product-info">
<div class="product-category">${categoryName}</div>
<div class="product-name">${productName}</div>
<div class="product-price">
<span class="price-current">${finalPrice.toFixed(2)} €</span>
${hasPromo ? `<span class="price-original">${basePrice.toFixed(2)} €</span>` : ''}
</div>
</div>
</div>
`;
}

function handleImageError(img) {
console.warn('[Catalogue] Image non chargée:', img.src);
img.src = DEFAULT_PRODUCT_IMAGE;
img.onerror = null; // Éviter boucle infinie
}

function goToProduct(productId) {
console.log('[Catalogue] Navigation vers produit:', productId);
window.location.href = `product.html?id=${productId}`;
}

function addToCart(productId, event) {
if (event) event.stopPropagation();
showToast('Fonctionnalité en cours de développement', 'info');
}

// ============================================
// INITIALISATION
// ============================================
document.addEventListener('DOMContentLoaded', () => {
console.log('[Catalogue] Page chargée');
loadProducts();
updateCartBadge();
});
</script>

</body>
</html>
